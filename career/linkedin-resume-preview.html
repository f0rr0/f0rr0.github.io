<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sid Jain — Résumé preview</title>
    <style>
      @font-face {
        font-family: Literata;
        src: url("../src/app/fonts/Literata-Latin.woff2") format("woff2");
        font-weight: 200 900;
      }
      @font-face {
        font-family: "Source Sans 3";
        src: url("../src/app/fonts/SourceSans3-Latin.woff2") format("woff2");
        font-weight: 200 900;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: #1a1918;
        color: #e7e5e4;
        font-family: "Source Sans 3", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: 1200px;
        height: 630px;
        padding: 64px 80px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .label {
        display: flex;
        align-items: center;
        gap: 20px;
        color: #f0b85f;
        font-size: 28px;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      .label::before {
        content: "";
        width: 48px;
        height: 3px;
        background: currentColor;
      }
      h1 {
        margin: 0 0 24px;
        font-family: Literata, serif;
        font-size: 120px;
        font-weight: 600;
        line-height: 1.1;
        letter-spacing: -0.045em;
      }
      p {
        margin: 0;
        font-size: 48px;
        line-height: 1.2;
      }
      footer {
        display: flex;
        justify-content: space-between;
        border-top: 1px solid #57534e;
        padding-top: 26px;
        color: #a8a29e;
        font-size: 28px;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="label">Résumé</div>
      <div>
        <h1>Sid Jain</h1>
        <p>Senior Full-Stack Engineer</p>
      </div>
      <footer>
        <span>f0rr0.dev</span>
        <span>10+ years in web &amp; mobile</span>
      </footer>
    </main>
  </body>
</html>
